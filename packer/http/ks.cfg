#version=RHEL9

text

cdrom

lang en_US.UTF-8
keyboard fr

timezone UTC --utc

network --bootproto=dhcp --activate

rootpw --plaintext baddaz42684

user --name=packer --plaintext --password=packer --groups=wheel

firewall --enabled

selinux --enforcing

services --enabled=sshd

firstboot --disable

clearpart --all --initlabel

autopart

reboot

%packages
@core
vim
python3
sudo
openssh-clients
openssh-server
git
open-vm-tools
%end

%post --log=/root/ks-post.log
sed -i 's|^Subsystem[[:space:]]\+sftp.*|Subsystem sftp internal-sftp|' /etc/ssh/sshd_config
echo '%wheel ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/90-packer-wheel
chmod 0440 /etc/sudoers.d/90-packer-wheel
%end
